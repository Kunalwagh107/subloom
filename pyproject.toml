[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "subloom"
dynamic = ["version"]
description = "Private, local subtitles for English, Hindi and Hinglish"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
dependencies = ["PySide6==6.8.3", "psutil==6.1.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-qt==4.4.0", "pysubs2==1.8.0", "ruff==0.12.11", "PyInstaller==6.12.0", "pyinstaller-hooks-contrib==2026.9"]

[project.gui-scripts]
subloom = "subloom.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "subloom.__version__"}

[tool.setuptools.package-data]
subloom = ["ui/*.qml", "ui/*.svg", "model_manifest.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
markers = ["integration: requires local FFmpeg", "asr: requires local whisper.cpp and model", "gui: Qt integration"]

[tool.ruff]
line-length = 110
target-version = "py311"
